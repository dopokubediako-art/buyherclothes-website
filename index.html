<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BuyHerClothes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
    }

    header {
      background: #000;
      color: #fff;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    nav a {
      color: #fff;
      margin-left: 20px;
      text-decoration: none;
    }

    .hero {
      background: url('https://images.unsplash.com/photo-1521335629791-ce4aec67dd47') center/cover;
      color: white;
      padding: 120px 40px;
      text-align: center;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero button {
      padding: 12px 25px;
      border: none;
      background: #ff4081;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .section {
      padding: 50px 40px;
      text-align: center;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .product {
      background: white;
      padding: 15px;
      width: 200px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>BuyHerClothes</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Style That Defines You</h2>
  <p>Discover the latest fashion trends</p>
  <button>Shop Now</button>
</section>

<section class="section">
  <h2>Featured Products</h2>

  <div class="products">
    <div class="product">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <p>Summer Dress</p>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
      <p>Casual Outfit</p>
    </div>

    <div class="product">
      <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
      <p>Luxury Style</p>
    </div>
  </div>
